# Builds the driver and runs the tests on every push and pull request. A tag like v0.1.0 also
# makes a GitHub release with the two downloads (scripts/package.ps1).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # for the release on tags

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: frame-hands
          path: dist/*.*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FrameHands-windows.zip
            dist/frame-hands-headset.tar.gz
          generate_release_notes: true
